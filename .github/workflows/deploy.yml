name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:   # allows manual trigger from Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Generate js/config.js from repository secrets.
      # Add these secrets in: Settings → Secrets and variables → Actions
      #   GOOGLE_CLIENT_ID   — from Google Cloud Console → APIs & Services → Credentials
      #   FIREBASE_API_KEY   — from Firebase Console → Project settings → Your apps
      #   FIREBASE_APP_ID    — from Firebase Console → Project settings → Your apps
      - name: Inject runtime config from secrets
        env:
          GOOGLE_CLIENT_ID:        ${{ secrets.GOOGLE_CLIENT_ID }}
          FIREBASE_API_KEY:        ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN:    ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID:     ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_SENDER_ID:      ${{ secrets.FIREBASE_SENDER_ID }}
          FIREBASE_APP_ID:         ${{ secrets.FIREBASE_APP_ID }}
          RAZORPAY_KEY_ID:         ${{ secrets.RAZORPAY_KEY_ID }}
        run: |
          cat > js/config.js <<EOF
          /* Auto-generated by CI — do not edit */
          window.FINRESOLVER_CONFIG = {
            googleClientId: '${GOOGLE_CLIENT_ID}',
            firebase: {
              apiKey:            '${FIREBASE_API_KEY}',
              authDomain:        '${FIREBASE_AUTH_DOMAIN}',
              projectId:         '${FIREBASE_PROJECT_ID}',
              storageBucket:     '${FIREBASE_STORAGE_BUCKET}',
              messagingSenderId: '${FIREBASE_SENDER_ID}',
              appId:             '${FIREBASE_APP_ID}',
            },
            razorpayKey: '${RAZORPAY_KEY_ID}',
          };
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'   # deploy from repo root where index.html lives

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
